name: CI

on:
  push:
    branches: [main]
  # `pull_request` with no `types:` defaults to [opened, synchronize, reopened] — a body edit
  # fires none of them. But `check-pr-rules.js` gates on the PR BODY (`PR_BODY`, below): a PR
  # that touches `rdo-members.ts` and adds its `File.pas:Line` citation AFTER opening fails the
  # run that read the empty body, and no later event ever re-reads it. The required check stays
  # red forever and the PR can never merge — #380 sat there, with a valid citation in its body
  # and a session waiting on a re-run that no event could produce. `edited` is the only trigger
  # that carries a body change, so it has to be here. It also fires on title edits and on the
  # routine "live evidence in the PR body" write, i.e. a full re-run per edit; the concurrency
  # group below coalesces bursts, and a spare 3-minute run is the cheaper half of the trade.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A merge queue runs its required checks on a SPECULATIVE commit
  # (`gh-readonly-queue/main/pr-N-<sha>`), which is not a push and not a pull request.
  # Without this trigger the required `typecheck + tests` context never reports there, and
  # every queue entry sits until it is ejected on the check-response timeout. GitHub's own
  # words: "You must use the merge_group event to trigger your GitHub Actions workflow when
  # a pull request is added to a merge queue. Otherwise, status checks will not be
  # triggered." So this has to land BEFORE the queue is enabled — including for the pull
  # request that enables it. #158 stage D.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a merge-group run: the queue is waiting on that exact check to report, and
  # a cancelled required check reads as a failure that ejects the entry. Only pull-request
  # and branch runs are worth superseding.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the changed-line coverage step diffs against origin/main.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Build (server + client + terrain-test)
        # The bench worker builds before every gate; CI builds too so a PR that never sat
        # on the bench (a dependency bump, an external contributor) cannot ship a tree
        # that does not compile to a runnable gateway.
        run: npm run build

      - name: Audit production dependencies (SEC-D-1)
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        if: github.event_name != 'pull_request'
        run: npm test

      # PR-only, deliberately. In a merge group this step is skipped, and the run is still
      # green — which is safe only because the queue admits nothing that has not already
      # passed its pull-request checks, where this ran against the same changed lines.
      # The residual, stated: the merge commit's diff against main can differ from the PR's
      # if main moved, so changed-line coverage is measured on the PR's base, not the
      # queue's. Accepted — the alternative is measuring coverage against a base the author
      # never saw.
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        run: npm run coverage:changed

      # The two rules CLAUDE.md states and the ruleset cannot express. This runs inside
      # the REQUIRED check rather than as a job of its own, so it blocks a merge without
      # anyone having to touch the ruleset.
      # PR-only of necessity, not by choice: this reads the pull request's body, and a
      # merge_group event carries none. The PR-level run is the enforcement point.
      - name: PR rules (coverage ratchet, RDO citation)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # The base BRANCH, never `base.sha`. `base.sha` is frozen at the moment the pull
          # request was OPENED, while CI checks out the merge ref — this branch merged into
          # the base's CURRENT tip. Diffing against the frozen sha therefore attributes every
          # file main gained in between to this pull request. On 2026-09-12 that failed the
          # RDO citation rule on PR #743, whose five files do not include `rdo-members.ts`:
          # main had merged a (properly cited) catalogue change between the PR's two pushes,
          # and the stale base pulled main's 37 files into the PR's 5. `coverage-changed.js`
          # never had the bug because it resolves `origin/main` itself.
          BASE_SHA: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/check-pr-rules.js

      # The harness the agent itself runs on. A broken hook makes the push gate silently
      # optional, and nothing else in the suite would notice.
      - name: Skills manifest is current
        run: node .claude/generate-skills-manifest.js --check

      - name: Hooks parse
        run: bash -n .claude/hooks/*.sh scripts/*.sh
