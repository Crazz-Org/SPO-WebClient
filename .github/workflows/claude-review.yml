# A second reader for every pull request.
#
# On this repository the code is written by an agent session, and that same session ticks
# the template's boxes and merges the PR. `bench/gate` proves the code runs live against
# planitia; `typecheck + tests` proves it compiles, passes and covers its own lines. Neither
# says anything about design, debt, or a CLAUDE.md rule quietly worked around — because
# until now the only reader of the diff was the one who wrote it.
#
# This job is that reader. It carries no session context, which is the whole point: it does
# not share the blind spots of whoever produced the change.
#
# ## Informational, deliberately
#
# `continue-on-error: true` and no entry in the `main` ruleset: this check can never block a
# merge. Recommended by #122 for the first dozen PRs, to calibrate how noisy the reviewer is
# before anything depends on it. Making it blocking later is a two-part decision — drop the
# flag here AND update src/__tests__/claude-review-workflow.test.ts, which pins the current
# posture so the change cannot happen by accident.
#
# ## `pull_request`, never `pull_request_target`
#
# The opposite choice from labeler.yml, for the opposite reason. That job checks out nothing
# and runs no repository code, so the elevated token is safe there. This one checks out the
# PR head and hands a live credential to a process reading it — under `pull_request_target`
# that pair is a credential-exfiltration hole, and a fork PR could open it by editing a file.
# `pull_request` gives a fork a read-only token instead: the review simply cannot post, which
# is the correct failure. Same-repo branches (every session PR) get the write token they need.
#
# ## Two credentials, not one
#
# The subscription token below authenticates to Claude. It says nothing about GitHub, and the
# action does NOT fall back to the workflow's own token: with no `github_token` input it takes
# the GitHub App path, which exchanges a GitHub OIDC token and therefore needs
# `id-token: write` plus the Claude app installed. Neither is true here, so the action died
# before Claude ran — `Could not fetch an OIDC token`, three attempts, then exit 1 — and
# `continue-on-error` reported that as a green check (run 32826227442, 2026-08-25).
#
# `secrets.GITHUB_TOKEN` is the simpler half of the same choice: this job reads the diff and
# writes comments on one pull request, which is exactly `contents: read` +
# `pull-requests: write` as already declared. No app to install, no OIDC, no extra permission
# — and on a fork PR that token is read-only, so the review still fails to post rather than
# failing open.
#
# ## The credential is a subscription token, not an API key
#
# This repository has no Anthropic API key and does not want one: the maintainer holds a
# Claude Max subscription, and the action authenticates against it with a long-lived OAuth
# token instead — `claude setup-token` locally, stored as `CLAUDE_CODE_OAUTH_TOKEN` under
# Settings → Secrets and variables → Actions. `anthropic_api_key` is the other half of the
# same input pair (claude-code-action docs/setup.md:9-10); only one is set, and setting both
# is meaningless here.
#
# The token EXPIRES, unlike an API key. When it does, the guard below turns the job back
# into a green notice rather than a red X, which is the same failure mode as never having
# provisioned it: re-run `claude setup-token` and replace the secret.
#
# ## Until the secret exists
#
# Every step is guarded on it, so an unprovisioned repository gets a green, skipped job with
# a notice — not a red X on every pull request.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependabot runs with its own secret store and cannot read CLAUDE_CODE_OAUTH_TOKEN, so the
    # guard below would skip it anyway. Stated here because a lockfile bump is the one diff
    # a design reviewer has nothing to say about, and silence should be intended, not lucky.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    # `secrets` is available in neither a job-level nor a step-level `if` — GitHub rejects
    # the whole file at validation, which shows up as a run named after the path with no
    # jobs and no annotation, and leaves every other check green. `jobs.<id>.env` IS one of
    # the places `secrets` may be read, and `env` IS one of the contexts a step `if` may
    # read, so the presence of the token is turned into a boolean here and tested downstream.
    # Only the boolean crosses; the token itself never lands in the environment.
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      # Unconditional by design: it is how a human learns why nothing was reviewed. An
      # expired token reads exactly like an absent one here, so the remedy covers both.
      - name: Announce a missing token
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: |
          echo "::notice title=Claude Review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set on this repository — no review was produced. Generate one with 'claude setup-token' (Claude Pro/Max) and add it under Settings > Secrets and variables > Actions."

      - name: Checkout
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reviewer reads the PR head and the files around the diff, not the history.
          fetch-depth: 1

      - name: Review the diff
        id: review
        if: env.HAS_CLAUDE_TOKEN == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Authenticates to GitHub, not to Claude. See the header: without it the action
          # takes the GitHub App path and needs `id-token: write` and an app install.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # CLAUDE.md § Model routing: analysis goes to Fable 5, execution to Opus 5. A
          # review is analysis. One line to change if calibration says otherwise.
          claude_args: |
            --model claude-fable-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request on Starpeace Online WebClient — a browser client
            that must stay wire-compatible with the original Delphi servers. The PR branch is
            already checked out in the working directory. Read CLAUDE.md first, and the nested
            CLAUDE.md in any directory the diff touches (src/server/, src/shared/,
            src/client/, src/mock-server/) — they are the rules this repository is held to.

            Get the diff with `gh pr diff`. Review only what the diff changes.

            ## What to look for, in priority order

            1. **A hand-built RDO protocol string.** Every frame comes from `rdoCall`,
               `rdoGet` or `rdoSet` in `@/shared/rdo-frame`, with `RdoValue` arguments. A
               separator ("^", "*") written by hand, or a frame assembled by concatenation,
               is the most serious defect this repository can ship: a wrong separator means a
               server freeze or an arbitrary memory write, and there is no self-recovery.
            2. **`any`.** Catch blocks take `unknown` plus `toErrorMessage(err)`; data takes a
               typed interface. A cast that launders `any` through `as` counts.
            3. **A UI element added without its action wired.** A button, menu entry or
               control that renders but whose handler is missing, empty, or a TODO.
            4. **A test modified to make it pass.** A changed assertion, a loosened matcher, a
               removed case, a `skip` — where the production change should have been the fix
               instead. Say which test and what it stopped guarding.
            5. **An abstraction built for a hypothetical need.** A layer, option, generic or
               registry with exactly one caller and no second one in sight. The rule is the
               simplest solution that meets the criterion.

            Beyond that list, raise real correctness bugs, and anything that quietly widens
            the blast radius of the live E2E accounts (mutations belong on Helartia only).

            ## What NOT to say

            The `typecheck + tests` check already enforces, mechanically, on this same PR:
            lint, TypeScript, the full Jest suite, ≥93% coverage on changed lines, the
            Jest threshold ratchet and the `File.pas:Line` citation for `rdo-members.ts`.
            Repeating any of them is pure noise — skip them entirely.
            Skip formatting too: Prettier is configured but deliberately not enforced.

            Do not praise, do not summarise the diff back, do not restate the PR description.
            You are a second reader, not a status report.

            ## How to report

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for anything that lands on specific lines.

            Then post exactly one top-level comment with `gh pr comment`, starting with the
            line `### Claude review`, listing anything that does not belong on a line, and
            naming the rule each finding breaks. **If you found nothing worth raising, say so
            in one sentence and stop** — a short comment is the expected outcome on most PRs,
            and inventing a finding to look useful is the failure mode that gets this job
            switched off.

            Post GitHub comments only. Do not return review text as a message.

      # `continue-on-error` is the posture #122 asked for: this reviewer may not fail a pull
      # request. It also makes a CRASHED action indistinguishable from a quiet one — the job
      # goes green either way, which is how the OIDC failure above survived unnoticed. The
      # step outcome is the one place that difference is still readable, so it is said out
      # loud here. Still not a failure: a warning annotation, on a job that stays green.
      - name: Say so when the reviewer crashed
        if: env.HAS_CLAUDE_TOKEN == 'true' && steps.review.outcome == 'failure'
        run: |
          echo "::warning title=Claude Review failed::The reviewer errored instead of reviewing — no review was produced. This job stays green by design; open the 'Review the diff' step for the cause."
